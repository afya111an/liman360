# Regenerates the static GitHub Pages demo (docs/) with that day's TCMB exchange rates.
name: Refresh demo

on:
  schedule:
    - cron: '30 13 * * 1-5'   # 16:30 Istanbul, Mon-Fri, after TCMB publishes (~15:30)
  workflow_dispatch:           # "Run workflow" button in the Actions tab

permissions:
  contents: write   # commit the regenerated docs/ (the push itself starts the Pages build)

concurrency:
  group: refresh-demo
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Regenerate demo
        env:
          TZ: Europe/Istanbul
        run: python manage.py export_demo

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs; then
            echo "Demo unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Demo: daily refresh with TCMB rates ($(TZ=Europe/Istanbul date +%d.%m.%Y))"
          git push

