<div class="f {{ field.field.span }}{% if field.errors %} has-error{% endif %}{% if field.widget_type == 'checkbox' %} f-check{% endif %}">
  <label for="{{ field.id_for_label }}"><span class="no" aria-hidden="true">{{ n }}</span>{{ field.label|capfirst }}{% if field.field.required %}<span class="req" aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text and not field.errors %}<p class="hint">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<p class="field-error">{{ field.errors.0 }}</p>{% endif %}
</div>
